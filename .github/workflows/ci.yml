name: CI

on:
  push:
    # Branches only: a tag points at a commit that already ran CI on main.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; pushes to branches (main included) always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (ESIKit's OpenAPI runtime needs Swift 6.2)
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # LiveTests hit the real SDE/ESI; they run in live.yml.
        run: swift test --skip LiveTests

