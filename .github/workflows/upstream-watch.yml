name: Upstream watch

# Weekly diff of the live SDE (ESI from 0.2) against Spec/pins.json. Opens an issue labelled
# `upstream` when something changed, or comments on the open one. Needs no secrets.
on:
  schedule:
    - cron: "37 6 * * 1" # Mondays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream
        id: check
        run: |
          set +e
          Scripts/check-upstream.sh > "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            echo "::error::check-upstream.sh failed with exit code $code"
            exit "$code"
          fi

      - name: Open or update issue
        if: steps.check.outputs.exit_code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDE_RELEASE: ${{ steps.check.outputs.sde_release }}
          ESI_DATE: ${{ steps.check.outputs.esi_date }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.md"
          body="$RUNNER_TEMP/body.md"
          digest="$(sha256sum "$report" | cut -c1-16)"
          last_commit="$(git log -1 --format=%cs)"
          {
            cat "$report"
            echo
            echo "---"
            echo "Last commit: $last_commit. GitHub disables scheduled workflows after 60 days without repository activity."
            echo "<!-- upstream-report: $digest -->"
          } > "$body"

          gh label create upstream --color 0E8A16 \
            --description "Changes in ESI or the SDE that may need work" 2>/dev/null || true

          issue="$(gh issue list --label upstream --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$issue" ]; then
            gh issue create --title "Upstream changes: SDE $SDE_RELEASE / ESI $ESI_DATE" --label upstream --body-file "$body"
          elif gh issue view "$issue" --json body,comments --jq '.body, .comments[].body' | grep -qF "upstream-report: $digest"; then
            echo "Issue #$issue already has this report; not commenting again."
          else
            gh issue comment "$issue" --body-file "$body"
          fi
